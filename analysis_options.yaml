include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - test/test_suite/**

linter:
  rules:
    - prefer_final_locals
    - prefer_final_fields
    - always_declare_return_types
    - avoid_dynamic_calls
    - unawaited_futures
