# Publishes to pub.dev when a tag like v0.2.0 is pushed, with the OIDC token of
# GitHub Actions: https://dart.dev/tools/pub/automated-publishing
name: Publish to pub.dev

on:
  push:
    tags:
      # Must match the tag pattern on pub.dev: v{{version}}
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
